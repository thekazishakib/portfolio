<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Clean White Background -->
  <rect width="120" height="120" rx="16" fill="#FFFFFF" />

  <g stroke="#232B33" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Monitor Frame (wrapping from outer book pages down around bottom) -->
    <path d="M22 39 H17 C13.5 39 11 41.5 11 45 V81 C11 84.5 13.5 87 17 87 H103 C106.5 87 109 84.5 109 81 V45 C109 41.5 106.5 39 103 39 H98" />

    <!-- Monitor Lower Bezel Horizontal Line -->
    <line x1="11" y1="76" x2="109" y2="76" />

    <!-- Monitor Stand Neck (flared curves) -->
    <path d="M51 87 C51 94 46 98 43 102" />
    <path d="M69 87 C69 94 74 98 77 102" />

    <!-- Monitor Stand Mid Line & Base -->
    <line x1="45" y1="99" x2="75" y2="99" />
    <line x1="36" y1="103" x2="84" y2="103" />

    <!-- Back / Outer Book Pages (left and right layers behind main open pages) -->
    <path d="M28 28 H22 V59 L60 68 L98 59 V28 H92" fill="#FFFFFF" />

    <!-- Main Open Book Left Page -->
    <path d="M60 25 C49 18 37 18 28 23 V53 C37 49 49 50 60 68 Z" fill="#FFFFFF" />

    <!-- Main Open Book Right Page -->
    <path d="M60 25 C71 18 83 18 92 23 V53 C83 49 71 50 60 68 Z" fill="#FFFFFF" />

    <!-- Book Center Spine -->
    <line x1="60" y1="25" x2="60" y2="68" />

    <!-- Left Page Curved Text Lines (3 lines) -->
    <path d="M34 30 C41 27 49 28 54 33" />
    <path d="M34 38 C41 35 49 36 54 41" />
    <path d="M34 46 C41 43 49 44 54 49" />

    <!-- Right Page Curved Text Lines (3 lines) -->
    <path d="M86 30 C79 27 71 28 66 33" />
    <path d="M86 38 C79 35 71 36 66 41" />
    <path d="M86 46 C79 43 71 44 66 49" />
  </g>
</svg>
